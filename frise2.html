<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biographie - Alain Pradier</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: transparent !important;
            font-family: var(--font-primary), sans-serif;
            color: var(--black);
            margin: 0;
            padding: 3rem 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .bio-container {
            width: 100%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 4rem;
            align-items: center;
            background: #fff;
            padding: 4rem;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(11, 31, 80, 0.08); /* Ombre aux couleurs de --black */
        }

        /* -- Profil Gauche -- */
        .bio-profile {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .bio-photo-wrapper {
            position: relative;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            padding: 6px;
            background: linear-gradient(135deg, var(--primary-color), var(--black));
            box-shadow: 0 15px 30px rgba(194, 148, 93, 0.3);
            margin-bottom: 2rem;
            transition: transform 0.4s ease;
        }

        .bio-photo-wrapper:hover {
            transform: scale(1.05) translateY(-5px);
        }

        .bio-photo {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #fff;
            background-color: #fff;
        }

        .bio-name {
            font-family: var(--font-display), serif;
            font-size: 3.8rem;
            color: var(--black);
            line-height: 0.9;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .bio-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* -- Timeline Droite -- */
        .bio-journey {
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
            position: relative;
            padding-left: 3rem;
            border-left: 3px dashed rgba(194, 148, 93, 0.3);
        }

        .journey-item {
            position: relative;
            background: #fdfdfd;
            padding: 2rem 2.5rem;
            border-radius: 16px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* Effet de rebond léger */
            box-shadow: 0 5px 15px rgba(0,0,0,0.03);
            border: 1px solid rgba(0,0,0,0.03);
            cursor: default;
        }

        .journey-item:hover {
            transform: translateX(10px);
            background: #fff;
            box-shadow: 0 15px 35px rgba(11, 31, 80, 0.08); /* --black shadow */
            border-color: rgba(194, 148, 93, 0.3);
        }

        .journey-dot {
            position: absolute;
            left: -3rem;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            background: var(--white);
            border: 4px solid var(--primary-color);
            border-radius: 50%;
            transition: all 0.4s ease;
            z-index: 2;
        }

        .journey-item:hover .journey-dot {
            background: var(--primary-color);
            box-shadow: 0 0 0 6px rgba(194, 148, 93, 0.25);
            transform: translate(-50%, -50%) scale(1.3);
        }

        .journey-year {
            font-family: var(--font-display), serif;
            font-size: 2.8rem;
            color: var(--primary-color);
            line-height: 1;
            margin-bottom: 0.5rem;
        }

        .journey-text {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--black);
            margin: 0;
            line-height: 1.4;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .bio-container {
                grid-template-columns: 1fr;
                padding: 2.5rem;
                gap: 3rem;
            }

            .bio-profile {
                border-bottom: 2px dashed rgba(194, 148, 93, 0.2);
                padding-bottom: 3rem;
            }

            .bio-journey {
                padding-left: 2rem;
            }

            .journey-dot {
                left: -2rem;
            }
        }
    </style>
</head>
<body>

    <div class="bio-container">
        <!-- Profil -->
        <div class="bio-profile">
            <div class="bio-photo-wrapper">
                <!-- Tu peux remplacer le src par le vrai lien vers la photo d'Alain Pradier -->
                <img src="https://ui-avatars.com/api/?name=Alain+Pradier&background=C2945D&color=fff&size=512&font-size=0.33" alt="Photo Alain Pradier" class="bio-photo" title="N'oublie pas d'insérer sa vraie photo ici !">
            </div>
            <h2 class="bio-name">Alain Pradier</h2>
            <div class="bio-title">Passion & Dévouement</div>
        </div>

        <!-- Frise / Parcours -->
        <div class="bio-journey">
            
            <div class="journey-item">
                <div class="journey-dot"></div>
                <div class="journey-year">1976</div>
                <p class="journey-text">Création du Grand Prix de Chardonnay</p>
            </div>

            <div class="journey-item">
                <div class="journey-dot"></div>
                <div class="journey-year">1989</div>
                <p class="journey-text">Créateur de l'association Créa Action</p>
            </div>

            <div class="journey-item">
                <div class="journey-dot"></div>
                <div class="journey-year">2012</div>
                <p class="journey-text">Fondateur et créateur de VÉLOCE</p>
            </div>

            <div class="journey-item">
                <div class="journey-dot"></div>
                <div class="journey-year">2026</div>
                <p class="journey-text">50 ans du Grand Prix de Chardonnay</p>
            </div>

        </div>
    </div>

</body>
</html>
